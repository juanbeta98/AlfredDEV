version: "3.9"

# DEV compose file — runs Alfred from the repo root using .env.docker
#
# How to run:
#   With OSRM:    docker-compose --profile osrm up -d osrm
#                 docker-compose run --rm alfred
#   Without OSRM: docker-compose run --rm alfred

services:
  osrm:
    profiles: ["osrm"]
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: osrm-colombia
    restart: unless-stopped
    volumes:
      - ./osrm_resources/osrm_data/colombia:/data:ro
    command: osrm-routed --algorithm mld /data/colombia-latest.osrm
    networks:
      - alfred-net

  alfred:
    build: .
    container_name: alfred-solver
    restart: "no"
    env_file:
      - .env.docker
    volumes:
      - ./request:/app/request
      - ./output:/app/data/runs
      - ./releases/licenses:/app/license:ro
    networks:
      - alfred-net

networks:
  alfred-net:
    driver: bridge
